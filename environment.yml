name: yflow
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - deno>=2.3

  # Deep learning
  - pytorch
  - torchvision
  - pytorch-cuda=12.4

  # Numerics / data
  - numpy
  - scipy
  - scikit-learn
  - pandas

  # Visualization
  - matplotlib
  - seaborn
  - pillow
  - tqdm

  # Config / notebooks
  - pyyaml
  - jupyter
  - ipykernel
  - pytest

  - pip:
      - triton==2.3.0
      - wandb
      - einops
      - omegaconf
      - tensorboard
      - torchdiffeq
      - huggingface_hub
      - diffusers>=0.33.0
      - accelerate
      - transformers
      - sentencepiece
      - av                    # MP4 timestamp 기반 디코딩 (PyAV)
      - opencv-python-headless # SIFT 대응점 검증 스크립트
      - "yt-dlp[default]"     # RealEstate10K 다운로드 + YouTube EJS 솔버
      - gdown                 # CLEVRER PropNet Google Drive 아카이브

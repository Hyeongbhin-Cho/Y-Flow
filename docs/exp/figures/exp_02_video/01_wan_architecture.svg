<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Wan generates video in latent space</title><desc id="desc">Wan2.1-T2V-1.3B  |  Text-conditioned DiT + Flow Matching + 3D causal VAE Our geometry lives in RGB coordinates; the sampler state lives in VAE latents.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3367d6"/></marker></defs><rect width="1600" height="900" fill="#f5f7fb"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="65" y="62" font-size="20" fill="#52627a" font-weight="700">EXP 02  /  VIDEO GEOMETRY                                         01 / 04</text><text x="65" y="124" font-size="43" fill="#17243b" font-weight="700">Wan generates video in latent space</text><text x="65" y="169" font-size="24" fill="#52627a" font-weight="400">Wan2.1-T2V-1.3B  |  Text-conditioned DiT + Flow Matching + 3D causal VAE</text><rect x="65" y="225" width="290" height="110" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="87" y="267" font-size="27" fill="#3367d6" font-weight="700">Text prompt</text><text x="87" y="305" font-size="21" fill="#52627a" font-weight="400">Scene description</text><path d="M355 280 L400 280" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="225" width="300" height="110" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="427" y="267" font-size="27" fill="#3367d6" font-weight="700">T5 text encoder</text><text x="427" y="305" font-size="21" fill="#52627a" font-weight="400">Text embeddings</text><path d="M555 335 L555 407" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="420" width="290" height="130" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="87" y="462" font-size="27" fill="#3367d6" font-weight="700">Noisy latent z</text><text x="87" y="500" font-size="21" fill="#52627a" font-weight="400">Random noise at start</text><path d="M355 480 L400 480" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="410" width="580" height="160" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="427" y="452" font-size="27" fill="#3367d6" font-weight="700">Wan DiT</text><text x="427" y="490" font-size="21" fill="#52627a" font-weight="400">Patchify → transformer blocks → velocity v</text><text x="427" y="538" font-size="22" fill="#52627a" font-weight="400">Self-attention + text cross-attention + FFN</text><path d="M985 480 L1030 480" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1035" y="420" width="475" height="130" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="1057" y="462" font-size="27" fill="#3367d6" font-weight="700">Flow Matching scheduler</text><text x="1057" y="500" font-size="21" fill="#52627a" font-weight="400">Velocity + timestep → next latent</text><path d="M1270 550 V605 H210 V550" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><text x="585" y="633" font-size="23" fill="#3367d6" font-weight="700">Repeat 30 sampling steps</text><rect x="580" y="665" width="350" height="95" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="602" y="707" font-size="27" fill="#3367d6" font-weight="700">Final clean latent</text><path d="M930 710 L975 710" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="660" width="290" height="110" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="1002" y="702" font-size="27" fill="#3367d6" font-weight="700">3D causal VAE</text><text x="1002" y="740" font-size="21" fill="#52627a" font-weight="400">Decoder: latent → RGB</text><path d="M1270 710 L1315 710" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><text x="1335" y="720" font-size="32" fill="#07877d" font-weight="700">Video</text><rect x="65" y="788" width="1470" height="72" rx="14" fill="#17243b"/><text x="88" y="833" font-size="26" fill="white" font-weight="700">Our geometry lives in RGB coordinates; the sampler state lives in VAE latents.</text></g></svg>
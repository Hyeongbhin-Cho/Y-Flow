<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Epipolar geometry restricts a match to a line</title><desc id="desc">Two views of a static 3D point  |  Schematic image-plane geometry An epipolar constraint narrows correspondence; it does not uniquely determine a new view.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3367d6"/></marker></defs><rect width="1600" height="900" fill="#f5f7fb"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="65" y="62" font-size="20" fill="#52627a" font-weight="700">EXP 02  /  VIDEO GEOMETRY                                         02 / 04</text><text x="65" y="124" font-size="43" fill="#17243b" font-weight="700">Epipolar geometry restricts a match to a line</text><text x="65" y="169" font-size="24" fill="#52627a" font-weight="400">Two views of a static 3D point  |  Schematic image-plane geometry</text><rect x="65" y="220" width="640" height="360" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="87" y="262" font-size="27" fill="#3367d6" font-weight="700">Image 1</text><text x="87" y="300" font-size="21" fill="#52627a" font-weight="400">Known pixel p in reference frame</text><rect x="750" y="220" width="785" height="360" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="772" y="262" font-size="27" fill="#3367d6" font-weight="700">Image 2</text><text x="772" y="300" font-size="21" fill="#52627a" font-weight="400">Matching pixel q must lie on the epipolar line</text><circle cx="350" cy="420" r="9" fill="#3367d6"/><text x="368" y="415" font-size="28" fill="#3367d6" font-weight="700">p</text><path d="M470 410 L810 410" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="380" font-size="30" fill="#3367d6" font-weight="700">l = Fp</text><path d="M810 515 L1460 320" fill="none" stroke="#07877d" stroke-width="3"/><text x="1200" y="323" font-size="24" fill="#07877d" font-weight="400">epipolar line l</text><circle cx="1120" cy="422" r="9" fill="#07877d"/><text x="1138" y="451" font-size="26" fill="#07877d" font-weight="700">q*</text><circle cx="1150" cy="522" r="9" fill="#c94c52"/><text x="1170" y="543" font-size="25" fill="#c94c52" font-weight="400">q (observed)</text><path d="M1150 522 L1120 422" fill="none" stroke="#c94c52" stroke-width="3" stroke-dasharray="8 6"/><text x="90" y="635" font-size="33" fill="#17243b" font-weight="700">Same 3D point → two camera images → qᵀ F p = 0</text><text x="90" y="691" font-size="30" fill="#3367d6" font-weight="400">F = K₂⁻ᵀ [t₂₁]× R₂₁ K₁⁻¹</text><text x="90" y="740" font-size="25" fill="#52627a" font-weight="400">Camera poses and intrinsics define F. Depth and position along the line remain unknown.</text><rect x="65" y="788" width="1470" height="72" rx="14" fill="#17243b"/><text x="88" y="833" font-size="26" fill="white" font-weight="700">An epipolar constraint narrows correspondence; it does not uniquely determine a new view.</text></g></svg>
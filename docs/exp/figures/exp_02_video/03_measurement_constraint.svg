<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Measure the video after applying the constraint</title><desc id="desc">Actual pilot metric: one-sided point-to-epipolar-line distance (not Sampson distance) Exact coordinate projection does not guarantee that the decoded video satisfies the constraint.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3367d6"/></marker></defs><rect width="1600" height="900" fill="#f5f7fb"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="65" y="62" font-size="20" fill="#52627a" font-weight="700">EXP 02  /  VIDEO GEOMETRY                                         03 / 04</text><text x="65" y="124" font-size="43" fill="#17243b" font-weight="700">Measure the video after applying the constraint</text><text x="65" y="169" font-size="24" fill="#52627a" font-weight="400">Actual pilot metric: one-sided point-to-epipolar-line distance (not Sampson distance)</text><rect x="65" y="225" width="420" height="110" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="87" y="267" font-size="27" fill="#3367d6" font-weight="700">1  Match RGB frames</text><text x="87" y="305" font-size="21" fill="#52627a" font-weight="400">SIFT + descriptor ratio test</text><path d="M485 280 L535 280" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="540" y="225" width="460" height="110" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="562" y="267" font-size="27" fill="#3367d6" font-weight="700">2  Measure using camera F</text><text x="562" y="305" font-size="21" fill="#52627a" font-weight="400">Point-to-line distance in pixels</text><path d="M1000 280 L1050 280" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1055" y="225" width="480" height="110" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="1077" y="267" font-size="27" fill="#3367d6" font-weight="700">3  Report reliability</text><text x="1077" y="305" font-size="21" fill="#52627a" font-weight="400">Median / p90 / match count / failures</text><text x="90" y="404" font-size="33" fill="#3367d6" font-weight="700">l = Fp = (a, b, c)       d = |a qₓ + b qᵧ + c| / √(a² + b²)</text><text x="90" y="462" font-size="28" fill="#17243b" font-weight="400">Hard coordinate projection:   q* = q − [(a qₓ + b qᵧ + c) / (a² + b²)] (a, b)</text><rect x="65" y="510" width="310" height="110" rx="18" fill="white" stroke="#07877d" stroke-width="2"/><text x="87" y="552" font-size="27" fill="#07877d" font-weight="700">Coordinate q*</text><text x="87" y="590" font-size="21" fill="#52627a" font-weight="400">Exact line constraint</text><path d="M375 565 L425 565" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="510" width="310" height="110" rx="18" fill="white" stroke="#3367d6" stroke-width="2"/><text x="452" y="552" font-size="27" fill="#3367d6" font-weight="700">RGB warp</text><text x="452" y="590" font-size="21" fill="#52627a" font-weight="400">Interpolate control points</text><path d="M740 565 L790 565" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="795" y="510" width="330" height="110" rx="18" fill="white" stroke="#c94c52" stroke-width="2"/><text x="817" y="552" font-size="27" fill="#c94c52" font-weight="700">VAE round-trip</text><text x="817" y="590" font-size="21" fill="#52627a" font-weight="400">Geometry may change</text><path d="M1125 565 L1175 565" fill="none" stroke="#3367d6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1180" y="510" width="355" height="110" rx="18" fill="white" stroke="#07877d" stroke-width="2"/><text x="1202" y="552" font-size="27" fill="#07877d" font-weight="700">Extract SIFT again</text><text x="1202" y="590" font-size="21" fill="#52627a" font-weight="400">Evaluate actual output</text><text x="90" y="686" font-size="25" fill="#52627a" font-weight="400">Controls: ≤64 px displacement; ≥12 controls; coverage ≥2%; nondegenerate F.</text><text x="90" y="730" font-size="25" fill="#c94c52" font-weight="400">Final evaluator: ≥8 matches. Near-zero projected residual only validates coordinate algebra.</text><rect x="65" y="788" width="1470" height="72" rx="14" fill="#17243b"/><text x="88" y="833" font-size="26" fill="white" font-weight="700">Exact coordinate projection does not guarantee that the decoded video satisfies the constraint.</text></g></svg>
# Exp-04. Robot-arm Y-Flow / POV evaluation manifest
exp: exp_04_robot_arm
task: robot_arm
seed: 0

source:
  implementation_root: experiments/exp_04_robot_arm
  upstream_repository: https://github.com/TU-Wien-ACIN-CDS/SafeFlowMPC.git
  upstream_commit: 3efe4d9522f4112b291a868866e7e4934697a261

data:

# configs/exp_01_swiss_roll.yaml
exp: exp_01_swiss_roll
seed: 0

data:
  name: swiss_roll
  cache_dir: datasets/swiss_roll/default
  regenerate: false
  a: 1.0
  u_min: 4.71238898038469    # 1.5 pi
  u_max: 14.137166941154069  # 4.5 pi
  n_turns: 1.5
  sigma_obs: 0.05
  n_train: 20000
  n_eval: 4000
  margin: 0.2
  tau: 0.15                  # 3 * sigma_obs

model:
  name: mlp
  dim: 2
  hidden: [64, 64, 64]
  time_embed_dim: 32

method:
  name: flow_matching
  sigma_min: 0.0

train:
  batch_size: 256
  steps: 20000
  lr: 1.0e-3
  ema_decay: 0.999

sample:
  n_samples: 4000
  n_steps: 100

log:
  out_dir: outputs/exp_01_swiss_roll
  plot_every: 2000

hardflow:
  t_on: 0.5
  lambda_oc: 10.0
  max_iter: 20

yflow:
  t_on: 0.5
  lambda_oc: 10.0
  mu: 1.0
  max_iter: 20
  delta: 0.1
  gamma_max: 1.0
  safety_buffer: 1.0e-4

safeflow:
  enabled: true
  integrator: euler           # euler | dopri5
  t_on: 0.5                   # paper experiment: CFMBF starts at t*=0.5
  phi_schedule: paper_piecewise
  phi0: 1.0
  phi_gamma: 0.9
  phi_omega: 3.0
  slack_weight: 1.0
  terminal_eps: 1.0e-3       # Dopri5 integrates to 1-eps before terminal filtering
  smooth_radius_eps: 1.0e-2
  smooth_tube_margin: 2.0e-3
  smooth_box_temperature: 1.0e-3
  qp_active_tol: 1.0e-6
  dopri5:
    rtol: 1.0e-5
    atol: 1.0e-7
  terminal_filter:
    enabled: true
    max_iter: 100
    ftol: 1.0e-7
    constraint_tol: 1.0e-7

guideflow:
  n_anchors: 256       # trajectory vocabulary V_a
  cvf: true            # Constraining the Velocity Field
  lambda_cvf: 0.1
  cvf_t_on: 0.0
  cf: true             # Constraining the Flow States
  cf_mode: interp      # interp | replace (Eq. 16 literal)
  k_c: 50
  rfe: true            # Refining the Flow by EBM
  tau_star: 0.5
  eta_max: 0.5
  n_refine: 10
  slack: 0.01
  w_tube: 1.0
  w_core: 1.0
  w_box: 1.0
  w_cost: 0.05
  guidance:            # Classifier-Free Intent and Reward Guidance (Eq. 12, 13)
    enabled: false     # false: frozen unconditional FlowMatch backbone (Exp-01 비교 기본값)
    signal: anchor     # anchor (C_p) | command (C_d). 논문상 동시 사용하지 않음
    n_commands: 5
    p_uncond: 0.2      # 조건 마스킹 확률 p
    gamma: 1.0         # guidance scale
    reward: true       # RAS: EP style condition
    ep: 1.0            # 추론 시 EP 값. 1에 가까울수록 공격적
    cond_steps: 20000
    cond_lr: 1.0e-3
    cond_batch_size: 256
    cond_hidden: [128, 128, 128]
    cond_embed_dim: 32
  rfe_train:           # Refining the Flow by EBM, 학습 측 (Eq. 18)
    rfe_loss: false    # false: 에너지를 추론 시점에만 평가 (Exp-01 비교 기본값)
    lambda_rfe: 1.0
    t_min: 0.5         # 에너지 항을 켜는 시각. Eq. (5)의 tau_star와 같은 역할
    rollout_steps: -1  # -1: 샘플러 격자(dt=1/K) 그대로 rollout. 0: posterior mean 근사. >0: 고정 스텝

device: cuda

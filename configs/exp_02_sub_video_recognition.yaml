# Exp-02 보조 실험: CLEVRER 영상에서 객체·궤적·충돌을 직접 인식
exp: exp_02_sub_video_recognition
seed: 42

# 원본 320x480 프레임을 종횡비를 유지해 160x240으로 축소한다.
data:
  name: clevrer_recognition
  cache_dir: datasets/clevrer
  train_split: train
  eval_split: validation
  n_train: null
  n_eval: 100
  n_frames: 33
  fps: 16
  start_time: 0.0
  height: 160
  width: 240
  n_slots: 6
  # Physical diagnostics use simulator world-coordinate units.
  r_xy: 12.0
  z0: 0.20
  tau_z: 0.05
  v_max: 3.2
  tau_kin: 0.20
  tau_acc: 0.60
  d0: 0.45
  d_min: 0.38
  tau_col: 0.20
  delta_v: 0.15
  eps_ident: 0.05
  eps_null: 1.0e-3

model:
  name: clevrer_resnet34
  local_dir: checkpoints/clevrer_recognition
  pretrained: true
  weights_path: checkpoints/resnet34_imagenet1k_v1.pth
  weights_name: ResNet34_Weights.IMAGENET1K_V1
  backbone_mode: frozen       # 대안 fine-tuning 비교는 layer3
  dim: 256
  slot_layers: 2
  temporal_layers: 4
  n_heads: 8
  ff_dim: 1024
  dropout: 0.1

train:
  batch_size: 4
  epochs: 30
  dev_fraction: 0.1
  early_stopping_patience: 8
  lr: 3.0e-4                 # fusion + recognition heads
  backbone_lr: 1.0e-5        # used when backbone_mode=layer3
  weight_decay: 1.0e-2
  grad_clip: 1.0
  lr_factor: 0.5
  lr_patience: 2
  num_workers: 4

loss:
  objectness: 1.0
  attributes: 1.0
  visibility: 1.0
  position: 5.0
  velocity: 2.0
  collision: 2.0
  kinematic: 0.1
  match_objectness: 1.0
  match_attributes: 1.0
  match_position: 5.0
  collision_pos_weight_cap: 20.0

eval:
  batch_size: 1
  num_workers: 2
  objectness_threshold: 0.5  # training calibrates thresholds on the dev split
  visibility_threshold: 0.5
  collision_threshold: 0.5
  collision_frame_tolerance: 2

device: cuda
